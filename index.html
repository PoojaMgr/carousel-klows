<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./carousel.css" />
</head>

<body>
    <h2>Custom Carousel</h2>
    <div class="container">
        <div class="group">
            <div class="card">
                <a class="image-container">
                    <img src="./images/1.jpg" alt="bird1" loading="lazy" />
                </a>
            </div>
            <div class="card">
                <a class="image-container">
                    <img src="./images/2.jpg" alt="bird2" loading="lazy" />
                </a>
            </div>
            <div class="card">
                <a class="image-container">
                    <img src="./images/3.jpg" alt="bird3" loading="lazy" />
                </a>
            </div>
            <div class="card">
                <a class="image-container">
                    <img src="./images/4.jpg" alt="bird4" loading="lazy" />
                </a>
            </div>
        </div>
    </div>

    <script src="./carousel.js" defer></script>
</body>

</html>
